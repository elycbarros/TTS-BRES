[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ttsbr"
version = "1.0.0"
description = "Pipeline local de conversão de texto para voz (TTS) em Português Brasileiro e Espanhol usando XTTS v2"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ely do Carmo Barros" }
]
requires-python = ">=3.10"
dependencies = [
    "coqui-tts[codec]",
    "torch",
    "torchaudio",
    "pydub",
    "numpy",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
ttsbr = "tts:main"
ttsbr-gui = "gui:iniciar_janela"
ttsbr-api = "servidor_api:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
